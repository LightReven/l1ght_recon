name: Publish L1ght Recon v2.1.1

on:
  push:
    branches:
      - publish-v2.1.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix correlation edge cases and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('l1ght_recon.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('VERSION = "2.1.0"', 'VERSION = "2.1.1"', 1)
          s = s.replace(
              '    "email", "account", "account_name", "usuario", "nome_usuario",\n',
              '    "email", "account", "account_name", "usuario", "nome_usuario",\n    "client_id", "clientid",\n',
              1,
          )

          start = s.index('    for i, item in enumerate(parsed_lines):\n')
          end = s.index('    for item in parsed_lines:\n', start)
          new_block = '''    identity_records = []\n    secret_records = []\n    for row in parsed_lines:\n        for field in row["fields"]:\n            record = (row["number"], field["key"], field["value"])\n            if field["key"] in SENSITIVE_IDENTITY_KEYS:\n                identity_records.append(record)\n            elif field["key"] in (SENSITIVE_PASSWORD_KEYS | SENSITIVE_HASH_KEYS | SENSITIVE_SECRET_KEYS):\n                secret_records.append(record)\n\n    for pos, identity in enumerate(identity_records):\n        next_identity_line = (\n            identity_records[pos + 1][0]\n            if pos + 1 < len(identity_records)\n            else None\n        )\n        candidates = [\n            secret for secret in secret_records\n            if secret[0] >= identity[0]\n            and secret[0] <= identity[0] + 2\n            and (next_identity_line is None or secret[0] < next_identity_line or secret[0] == identity[0])\n        ]\n        if not candidates:\n            continue\n        secret = min(candidates, key=lambda record: (abs(record[0] - identity[0]), record[0]))\n        pair_key = (url, identity[1], identity[2], secret[1], secret[2])\n        if pair_key in seen:\n            continue\n        seen.add(pair_key)\n        paired_secret_members.add(secret)\n        hash_type = _classify_hash_value(secret[2]) if secret[1] in SENSITIVE_HASH_KEYS else None\n        entropy = _shannon_entropy(secret[2])\n        score = 8 + path_bonus\n        if hash_type:\n            score += 2\n        if len(secret[2]) >= 20 and entropy >= 3.5:\n            score += 2\n        context_start = max(1, min(identity[0], secret[0]))\n        context_end = min(len(parsed_lines), max(identity[0], secret[0]) + 1)\n        context_lines = [\n            parsed_lines[line_no - 1]["text"]\n            for line_no in range(context_start, context_end + 1)\n            if parsed_lines[line_no - 1]["text"].strip()\n        ]\n        if any(_line_is_comment(row) for row in context_lines):\n            score -= 1\n        findings.append({\n            "kind": "credential_pair",\n            "confidence": _confidence_from_score(score),\n            "score": score,\n            "url": url,\n            "line": identity[0],\n            "identity_key": identity[1],\n            "identity_value": identity[2],\n            "secret_key": secret[1],\n            "secret_value": secret[2],\n            "classification": hash_type or ("credencial em texto" if secret[1] in SENSITIVE_PASSWORD_KEYS else "segredo/token"),\n            "context": "\\n".join(context_lines)[:1200],\n        })\n\n'''
          s = s[:start] + new_block + s[end:]
          p.write_text(s, encoding='utf-8')

          req = Path('requirements.txt')
          rq = req.read_text(encoding='utf-8')
          rq = re.sub(r'^# L1ght Recon v[^\n]+', '# L1ght Recon v2.1.1', rq, count=1, flags=re.M)
          req.write_text(rq, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          if '## Versão 2.1.1' not in r:
              r = r.replace('\n## Atualização\n', '\n## Versão 2.1.1\n\nA versão 2.1.1 corrige a correlação de pares em blocos de múltiplas credenciais e inclui `client_id/client_secret` como par contextual.\n\n## Atualização\n', 1)
          readme.write_text(r, encoding='utf-8')
          PY

          python3 -m py_compile l1ght_recon.py
          python3 -m pip install -q -r requirements.txt
          python3 - <<'PY'
          import runpy
          ns = runpy.run_path('l1ght_recon.py')
          detect = ns['_detect_sensitive_data']

          sample = 'DB_USER=root\nDB_PASSWORD=RootPass123!\nDB_USER=app\nDB_PASSWORD=AppPass456!'
          findings = [x for x in detect('http://192.0.2.10/config/.env', sample) if x.get('kind') == 'credential_pair']
          pairs = {(x['identity_value'], x['secret_value']) for x in findings}
          assert ('root', 'RootPass123!') in pairs, pairs
          assert ('app', 'AppPass456!') in pairs, pairs
          assert ('app', 'RootPass123!') not in pairs, pairs

          sample = 'client_id: webapp\nclient_secret: 7f9c1e8b4a6d2c0f9e7b1a3d5c8f2e6a'
          findings = [x for x in detect('http://192.0.2.10/config.json', sample) if x.get('kind') == 'credential_pair']
          assert any(x.get('identity_key') == 'client_id' and x.get('secret_key') == 'client_secret' for x in findings), findings
          print('v2.1.1 correlation tests: OK')
          PY

          bash -n setup_tools.sh
          SHA="$(sha256sum l1ght_recon.py | awk '{print $1}')"
          cp l1ght_recon.py releases/l1ght_recon_v2_1_1.py
          cat > releases/latest.json <<JSON
          {
            "version": "2.1.1",
            "channel": "stable",
            "url": "https://raw.githubusercontent.com/LightReven/l1ght_recon/main/releases/l1ght_recon_v2_1_1.py",
            "sha256": "$SHA",
            "notes": "Corrige correlação de múltiplos pares de credencial e adiciona client_id/client_secret ao detector contextual da série 2.1."
          }
          JSON
          rm -f .github/workflows/publish-v211.yml

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish L1ght Recon v2.1.1"
          git push origin HEAD:publish-v2.1.1
