name: Validate L1ght Recon v2.2.1

on:
  push:
    branches:
      - publish-v2.2.1

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile l1ght_recon.py
          bash -n setup_tools.sh
          grep -q 'VERSION = "2.2.1"' l1ght_recon.py
          grep -q 'requests>=2.31.0' requirements.txt
          ! grep -q 'for pkg in wafw00f seclists exploitdb' setup_tools.sh
          grep -q 'python3-requests python3-bs4' setup_tools.sh
          grep -q 'uninstall-no-record-file' setup_tools.sh
          grep -q -- '-status-code' setup_tools.sh
          python3 - <<'PY'
          import runpy
          ns = runpy.run_path("l1ght_recon.py")
          assert ns["VERSION"] == "2.2.1"
          assert ns["_ffuf_redirect_is_path_preserving_upgrade"](
              "http://192.0.2.10/test", "https://192.0.2.10/test"
          )
          profile = {
              "redirect_alias": False,
              "suffixes": [""],
              "signatures": {"": {
                  "status": 200, "length": 123, "words": 10,
                  "lines": 4, "has_location": False,
              }},
          }
          assert ns["_ffuf_item_matches_baseline"]({
              "url":"https://192.0.2.10/nope","status":200,
              "length":123,"words":10,"lines":4,"redirectlocation":""
          }, profile)
          assert not ns["_ffuf_item_matches_baseline"]({
              "url":"https://192.0.2.10/admin","status":403,
              "length":123,"words":10,"lines":4,"redirectlocation":""
          }, profile)
          print("core regressions OK")
          PY

  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone branch
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch publish-v2.2.1 https://github.com/LightReven/l1ght_recon.git /tmp/l1ght_recon
      - name: Run installer
        run: |
          set -euxo pipefail
          cd /tmp/l1ght_recon
          sudo bash setup_tools.sh
      - name: Verify runtime
        run: |
          set -euxo pipefail
          cd /tmp/l1ght_recon
          grep -q 'VERSION = "2.2.1"' l1ght_recon.py
          l1ght_recon -h >/tmp/help.txt
          httpx -h 2>&1 | grep -q -- '-status-code'
          katana -version
          nuclei -version
          ffuf -V
          nikto -Version || nikto -version || true
          whatweb --version
          wafw00f --version
          test -f /usr/share/wordlists/seclists/Discovery/Web-Content/big.txt
          test -f /usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-5000.txt
          python3 - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          print("requests", requests.__version__)
          print("bs4 OK")
          PY

  kali:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: kalilinux/kali-rolling:latest
    steps:
      - name: Bootstrap container
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates
          git clone --depth 1 --branch publish-v2.2.1 https://github.com/LightReven/l1ght_recon.git /tmp/l1ght_recon
      - name: Run installer
        run: |
          set -eux
          cd /tmp/l1ght_recon
          bash setup_tools.sh
      - name: Verify runtime
        run: |
          set -eux
          cd /tmp/l1ght_recon
          grep -q 'VERSION = "2.2.1"' l1ght_recon.py
          l1ght_recon -h >/tmp/help.txt
          httpx -h 2>&1 | grep -q -- '-status-code'
          katana -version
          nuclei -version
          ffuf -V
          whatweb --version
          wafw00f --version
          test -f /usr/share/wordlists/seclists/Discovery/Web-Content/big.txt
          test -f /usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-5000.txt
          python3 - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          print("requests", requests.__version__)
          print("bs4 OK")
          PY
