name: Publish L1ght Recon v2.2.1

on:
  push:
    branches:
      - publish-v2.2.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile l1ght_recon.py
          bash -n setup_tools.sh
          grep -q 'VERSION = "2.2.1"' l1ght_recon.py
          grep -q 'requests>=2.31.0' requirements.txt
          grep -q 'python3-requests python3-bs4' setup_tools.sh
          grep -q 'Dependências Python já atendidas pela distribuição' setup_tools.sh
          grep -q 'httpx-toolkit' setup_tools.sh
          grep -q -- '-status-code' setup_tools.sh
          grep -q 'Discovery/Web-Content Discovery/DNS' setup_tools.sh

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum l1ght_recon.py | awk '{print $1}')"
          cp l1ght_recon.py releases/l1ght_recon_v2_2_1.py
          cat > releases/latest.json <<JSON
          {
            "version": "2.2.1",
            "channel": "stable",
            "url": "https://raw.githubusercontent.com/LightReven/l1ght_recon/main/releases/l1ght_recon_v2_2_1.py",
            "sha256": "$SHA",
            "notes": "Correção de instalação em Kali/Debian/Ubuntu: preserva pacotes Python do APT, evita uninstall-no-record-file, valida corretamente o httpx da ProjectDiscovery, usa fallbacks binários oficiais e prepara somente a parte necessária da SecLists. Mantém as correções de FFUF da v2.2.0."
          }
          JSON
          rm -f .github/workflows/install-smoke-v220.yml
          rm -f .github/workflows/validate-v221.yml
          rm -f .github/workflows/publish-v221.yml

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish L1ght Recon v2.2.1"
          git push origin HEAD:publish-v2.2.1
