name: Smoke test L1ght Recon v2.2.0 installer

on:
  push:
    branches:
      - publish-v2.2.0

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Clone public main
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/LightReven/l1ght_recon.git /tmp/l1ght_recon
      - name: Run installer
        run: |
          set -euxo pipefail
          cd /tmp/l1ght_recon
          sudo bash setup_tools.sh
      - name: Verify runtime
        run: |
          set -euxo pipefail
          l1ght_recon -h >/tmp/help.txt
          grep -q '2.2.0' /tmp/help.txt
          httpx -h 2>&1 | grep -qi 'fast and multi-purpose HTTP toolkit'
          katana -version
          nuclei -version
          ffuf -V
          nikto -Version
          whatweb --version
          wafw00f --version
          test -f /usr/share/wordlists/seclists/Discovery/Web-Content/big.txt

  kali:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: kalilinux/kali-rolling:latest
    steps:
      - name: Bootstrap container
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates
          git clone --depth 1 https://github.com/LightReven/l1ght_recon.git /tmp/l1ght_recon
      - name: Run installer
        run: |
          set -eux
          cd /tmp/l1ght_recon
          bash setup_tools.sh
      - name: Verify runtime
        run: |
          set -eux
          l1ght_recon -h >/tmp/help.txt
          grep -q '2.2.0' /tmp/help.txt
          httpx -h 2>&1 | grep -qi 'fast and multi-purpose HTTP toolkit'
          katana -version
          nuclei -version
          ffuf -V
          nikto -Version
          whatweb --version
          wafw00f --version
          test -f /usr/share/wordlists/seclists/Discovery/Web-Content/big.txt
