name: Publish L1ght Recon v2.3.0

on:
  push:
    branches:
      - publish-v2.3.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile l1ght_recon.py
          bash -n setup_tools.sh
          grep -q 'VERSION = "2.3.0"' l1ght_recon.py
          grep -q -- '--fast' <(python3 l1ght_recon.py -h)
          grep -q 'mysql-empty-password' l1ght_recon.py
          grep -q 'http-shellshock' l1ght_recon.py
          grep -q 'common.txt' l1ght_recon.py
          grep -q -- '--ignore-installed' setup_tools.sh
          grep -q 'ORIGINAL_USER_HOME' setup_tools.sh

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum l1ght_recon.py | awk '{print $1}')"
          cp l1ght_recon.py releases/l1ght_recon_v2_3_0.py
          cat > releases/latest.json <<JSON
          {
            "version": "2.3.0",
            "channel": "stable",
            "url": "https://raw.githubusercontent.com/LightReven/l1ght_recon/main/releases/l1ght_recon_v2_3_0.py",
            "sha256": "$SHA",
            "notes": "Novo perfil --fast com Nmap top 2000 TCP, UDP top 100, FFUF common.txt depth 2 e até duas extensões, Nikto/Nuclei reduzidos; verificação Shellshock positiva-only; MySQL root/anonymous sem senha positiva-only; instalação reforçada para Kali/Ubuntu/WSL e ferramentas já existentes."
          }
          JSON
          rm -f .github/workflows/validate-v230.yml
          rm -f .github/workflows/publish-v230.yml

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish L1ght Recon v2.3.0"
          git push origin HEAD:publish-v2.3.0
