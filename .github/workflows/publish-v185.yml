name: Publish L1ght Recon v1.8.5

on:
  push:
    branches:
      - publish-v1.8.5
    paths:
      - '.publish/v185/**'
      - '.github/workflows/publish-v185.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate v1.8.5
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/v185/patch*.b64 | base64 -d | gzip -dc > /tmp/v185.patch
          test "$(sha256sum /tmp/v185.patch | awk '{print $1}')" = "e84ba7d8c9ba70b644a7c72c75e0bd6dd458c1dbf6f38985da855711c881f524"
          git apply --check /tmp/v185.patch
          git apply /tmp/v185.patch
          sed -i '1s/v1\.8\.4/v1.8.5/' requirements.txt
          python3 -m py_compile l1ght_recon.py
          bash -n setup_tools.sh
          grep -q 'VERSION = "1.8.5"' l1ght_recon.py
          grep -q 'DEFAULT_UDP_TOP_PORTS = 200' l1ght_recon.py
          grep -q 'FULL_UDP_TOP_PORTS = 400' l1ght_recon.py
          grep -q 'MAX_UDP_TOP_PORTS = 500' l1ght_recon.py
          grep -q 'UDP_PROGRESS_INTERVAL = 60' l1ght_recon.py
          grep -q '"--full"' l1ght_recon.py
          grep -q '"--udp-top"' l1ght_recon.py
          test "$(sha256sum l1ght_recon.py | awk '{print $1}')" = "bcc6743eabce234c8b400427b58227de143c31f6251aa88e0d07f8c6b5903993"
          cp l1ght_recon.py releases/l1ght_recon_v1_8_5.py
          cat > releases/latest.json <<'JSON'
          {
            "version": "1.8.5",
            "channel": "stable",
            "url": "https://raw.githubusercontent.com/LightReven/l1ght_recon/main/releases/l1ght_recon_v1_8_5.py",
            "sha256": "bcc6743eabce234c8b400427b58227de143c31f6251aa88e0d07f8c6b5903993",
            "notes": "UDP padrão top 200 e modo --full top 400; confirmação de open|filtered; FFUF adaptativo; scheduler por ferramenta; resultados progressivos; métricas internas e debug.log mais limpo."
          }
          JSON
          rm -rf .publish
          rm -f .github/workflows/publish-v185.yml

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish L1ght Recon v1.8.5"
          git push origin HEAD:publish-v1.8.5
