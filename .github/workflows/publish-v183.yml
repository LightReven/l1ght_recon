name: Publish L1ght Recon v1.8.3

on:
  push:
    branches:
      - publish-v1.8.3
    paths:
      - '.publish/v183/**'
      - '.github/workflows/publish-v183.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate v1.8.3
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/v183/chunk*.txt > /tmp/v183.patch
          test "$(sha256sum /tmp/v183.patch | awk '{print $1}')" = "48f69b99de841152dad19a67fc013c3c8402bb90da377f7415e0e74929e481e3"
          git apply --check /tmp/v183.patch
          git apply /tmp/v183.patch
          python3 -m py_compile l1ght_recon.py
          bash -n setup_tools.sh
          cp l1ght_recon.py releases/l1ght_recon_v1_8_3.py
          test "$(sha256sum l1ght_recon.py | awk '{print $1}')" = "6e24591a872e52a5bb3d5fddc324f57c8e9079e096a04cff355c32f3d0a34125"
          cat > releases/latest.json <<'JSON'
          {
            "version": "1.8.3",
            "channel": "stable",
            "url": "https://raw.githubusercontent.com/LightReven/l1ght_recon/main/releases/l1ght_recon_v1_8_3.py",
            "sha256": "6e24591a872e52a5bb3d5fddc324f57c8e9079e096a04cff355c32f3d0a34125",
            "notes": "Otimizações de desempenho e fluidez, relatório somente HTML, bootstrap automático, comando no PATH, log detalhado e enumeração SMB anônima somente leitura."
          }
          JSON
          rm -rf .publish
          rm -f .github/workflows/publish-v183.yml

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish L1ght Recon v1.8.3"
          git push origin HEAD:publish-v1.8.3
