name: Publish L1ght Recon v1.8.4

on:
  push:
    branches:
      - publish-v1.8.4
    paths:
      - '.publish/v184.patch'
      - '.github/workflows/publish-v184.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate v1.8.4
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .publish/v184.patch | awk '{print $1}')" = "e5439a9fba2aa13f31e0140195f3b01ed33ebb92b02bad7420fdd767699405e4"
          git apply --check .publish/v184.patch
          git apply .publish/v184.patch
          python3 -m py_compile l1ght_recon.py
          python3 l1ght_recon.py -h >/dev/null
          python3 l1ght_recon.py --flow >/dev/null
          bash -n setup_tools.sh
          cp l1ght_recon.py releases/l1ght_recon_v1_8_4.py
          test "$(sha256sum releases/l1ght_recon_v1_8_4.py | awk '{print $1}')" = "6d59671651ddb83db3bd665beef7bafa1f752644b54982435dd5e56fb6529033"
          cat > releases/latest.json <<'JSON'
          {
            "version": "1.8.4",
            "channel": "stable",
            "url": "https://raw.githubusercontent.com/LightReven/l1ght_recon/main/releases/l1ght_recon_v1_8_4.py",
            "sha256": "6d59671651ddb83db3bd665beef7bafa1f752644b54982435dd5e56fb6529033",
            "notes": "--check-update passa a instalar atualizações, checagem pré-argparse para compatibilidade com novos parâmetros, log destacado nos artefatos e limpeza de backups .bak legados."
          }
          JSON
          rm -f .publish/v184.patch
          rmdir .publish 2>/dev/null || true
          rm -f .github/workflows/publish-v184.yml

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish L1ght Recon v1.8.4"
          git push origin HEAD:publish-v1.8.4
