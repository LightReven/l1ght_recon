name: Publish L1ght Recon v2.0.1

on:
  push:
    branches: [publish-v2.0.1]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add execution time and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('l1ght_recon.py')
          s = path.read_text(encoding='utf-8')

          old = 'VERSION = "2.0.0"'
          assert old in s, 'versão base 2.0.0 não encontrada'
          s = s.replace(old, 'VERSION = "2.0.1"', 1)

          helper = '''\n\ndef format_execution_time(seconds):\n    total = max(0, int(round(float(seconds or 0))))\n    hours, rem = divmod(total, 3600)\n    minutes, secs = divmod(rem, 60)\n    if hours:\n        return f"{hours:02d}h {minutes:02d}m {secs:02d}s"\n    if minutes:\n        return f"{minutes:02d}m {secs:02d}s"\n    return f"{secs}s"\n'''
          marker = '\n\ndef print_final_compilation(\n'
          assert marker in s, 'print_final_compilation não encontrado'
          s = s.replace(marker, helper + marker, 1)

          old_sig = '''    output_dir,\n    html_report,\n):\n    section("FINAL")'''
          new_sig = '''    output_dir,\n    html_report,\n    elapsed_seconds,\n):\n    section("FINAL")'''
          assert old_sig in s, 'assinatura final não encontrada'
          s = s.replace(old_sig, new_sig, 1)

          old_end = '''    print()\n    success(f"{brand()} finalizado.")'''
          new_end = '''    print()\n    print(f"{DIM}Tempo de execução: {format_execution_time(elapsed_seconds)}{RESET}")\n    success(f"{brand()} finalizado.")'''
          assert old_end in s, 'bloco final não encontrado'
          s = s.replace(old_end, new_end, 1)

          start_marker = '''    extensions = None\n\n    if args.ffuf_depth < 1:'''
          start_repl = '''    execution_started = time.monotonic()\n\n    extensions = None\n\n    if args.ffuf_depth < 1:'''
          assert start_marker in s, 'ponto de início da execução não encontrado'
          s = s.replace(start_marker, start_repl, 1)

          call_marker = '''    metric_end("html_report", report_started, file=html_report)\n    print_final_compilation('''
          call_repl = '''    metric_end("html_report", report_started, file=html_report)\n    elapsed_seconds = time.monotonic() - execution_started\n    _debug_log("EXECUTION", f"total_duration={elapsed_seconds:.3f}s")\n    print_final_compilation('''
          assert call_marker in s, 'chamada final não encontrada'
          s = s.replace(call_marker, call_repl, 1)

          call_tail = '''        output_dir,\n        html_report,\n    )'''
          call_tail_new = '''        output_dir,\n        html_report,\n        elapsed_seconds,\n    )'''
          assert call_tail in s, 'cauda da chamada final não encontrada'
          s = s.replace(call_tail, call_tail_new, 1)

          path.write_text(s, encoding='utf-8')

          req = Path('requirements.txt')
          r = req.read_text(encoding='utf-8')
          if r.startswith('# L1ght Recon v2.0.0'):
              r = r.replace('# L1ght Recon v2.0.0', '# L1ght Recon v2.0.1', 1)
          req.write_text(r, encoding='utf-8')

          readme = Path('README.md')
          rd = readme.read_text(encoding='utf-8')
          anchor = '## Atualização\n'
          note = '## Versão 2.0.1\n\nA versão 2.0.1 adiciona discretamente o tempo total da enumeração ao final da execução e registra a duração total também no `debug.log`.\n\n'
          assert anchor in rd, 'seção Atualização não encontrada no README'
          rd = rd.replace(anchor, note + anchor, 1)
          readme.write_text(rd, encoding='utf-8')
          PY

          python3 -m py_compile l1ght_recon.py
          grep -q 'VERSION = "2.0.1"' l1ght_recon.py
          grep -q 'Tempo de execução:' l1ght_recon.py
          grep -q 'total_duration=' l1ght_recon.py

          sha="$(sha256sum l1ght_recon.py | awk '{print $1}')"
          cp l1ght_recon.py releases/l1ght_recon_v2_0_1.py
          cat > releases/latest.json <<JSON
          {
            "version": "2.0.1",
            "channel": "stable",
            "url": "https://raw.githubusercontent.com/LightReven/l1ght_recon/main/releases/l1ght_recon_v2_0_1.py",
            "sha256": "$sha",
            "notes": "Exibe discretamente o tempo total de execução ao final e registra a duração total no debug.log."
          }
          JSON

          rm -f .github/workflows/publish-v201.yml

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish L1ght Recon v2.0.1"
          git push origin HEAD:publish-v2.0.1
