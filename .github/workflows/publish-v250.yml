name: Publish L1ght Recon v2.5.0

on:
  push:
    branches:
      - publish-v2.5.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile l1ght_recon.py
          bash -n setup_tools.sh
          grep -q 'VERSION = "2.5.0"' l1ght_recon.py
          grep -q -- '--resume' <(python3 l1ght_recon.py -h)
          grep -q -- '--follow-up' <(python3 l1ght_recon.py -h)
          grep -q -- '--skip-git-enum' <(python3 l1ght_recon.py -h)
          grep -q 'stable_generic_baseline' l1ght_recon.py
          grep -q 'run_git_exposure_enum' l1ght_recon.py

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(sha256sum l1ght_recon.py | awk '{print $1}')"
          cp l1ght_recon.py releases/l1ght_recon_v2_5_0.py
          cat > releases/latest.json <<JSON
          {
            "version": "2.5.0",
            "channel": "stable",
            "url": "https://raw.githubusercontent.com/LightReven/l1ght_recon/main/releases/l1ght_recon_v2_5_0.py",
            "sha256": "$SHA",
            "notes": "Sessões retomáveis com session_state.json e auto-resume, --resume/--follow-up/--fresh, checkpoints por base FFUF, follow-up profundo de diretórios já descobertos, enumeração básica de .git exposto e correção de falsos positivos FFUF em respostas 503/429/5xx uniformes."
          }
          JSON
          rm -f .github/workflows/validate-v250.yml
          rm -f .github/workflows/publish-v250.yml

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish L1ght Recon v2.5.0"
          git push origin HEAD:publish-v2.5.0
